name: Sandbox Worker failure probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_OBSERVABILITY_TOKEN: ${{ secrets.CF_OBSERVABILITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Query redacted reconciliation failure evidence
        run: python3 scripts/cloudflare/query-sandbox-worker-failures.py
