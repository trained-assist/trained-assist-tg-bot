name: Prod-principal Telegram canary (pinned test bot -> production CP/Runner)

on:
  workflow_dispatch:
    inputs:
      run_canary:
        description: Run the pinned test bot against the real production CP principal/profile (prod-principal lane; NOT the real production bot)
        required: true
        type: boolean
        default: false
      diagnose_only:
        description: Read current pinned E2E lane evidence without deploying or changing state
        required: true
        type: boolean
        default: false
      resume_pending_input:
        description: Wake reconciliation for the single verified pinned queued E2E task
        required: true
        type: boolean
        default: false
      retry_route:
        description: Retry the saved route once when evidence confirms no continuation or run was issued
        required: true
        type: boolean
        default: false
      inspect_e2e_lane:
        description: Temporarily mount the isolated production E2E namespace for read-only evidence, then restore sandbox3 only if terminal and idle
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trained-assist-sandbox3-worker-e2e
  cancel-in-progress: false

jobs:
  prod-principal-canary:
    if: ${{ (inputs.run_canary == true || inputs.diagnose_only == true || inputs.resume_pending_input == true || inputs.retry_route == true || inputs.inspect_e2e_lane == true) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Require protected main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = "refs/heads/main"

      - name: Require resume mode for route retry
        if: ${{ inputs.retry_route == true && inputs.resume_pending_input != true }}
        run: exit 1

      - name: Keep isolated lane inspection read-only
        if: ${{ inputs.inspect_e2e_lane == true && (inputs.run_canary == true || inputs.resume_pending_input == true || inputs.retry_route == true) }}
        run: exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Verify pinned sandbox account, operator, and production services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX3_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_STAGING_TEST_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
          PRODUCTION_E2E_SIGNATURE: ${{ secrets.CONTROL_PLANE_PRODUCTION_E2E_SIGNATURE }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "d740a05e9442c1d0feacae2dfc673e93"
          test "$TG_SANDBOX3_CHAT_ID" = "1714048"
          test "$TG_STAGING_TEST_USER_ID" = "1714048"
          test -n "$TG_SANDBOX3_OPERATOR_TOKEN"
          [[ "$PRODUCTION_E2E_SIGNATURE" =~ ^[a-f0-9]{64}$ ]]
          npx wrangler whoami --json > "$RUNNER_TEMP/canary-whoami.json"
          node --input-type=module - "$RUNNER_TEMP/canary-whoami.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const identity = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (!identity.loggedIn || !(identity.accounts ?? []).some(item => item.id === 'd740a05e9442c1d0feacae2dfc673e93')) {
            throw new Error('sandbox_cloudflare_account_mismatch');
          }
          for (const [url, expected] of [
            ['https://trained-assist-cp-production.skillset-apply.workers.dev/healthz', 'trained-assist-control-plane'],
            ['https://trained-assist-runner-api-production.skillset-apply.workers.dev/healthz', 'ai-agent-runner-api'],
          ]) {
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const body = await response.json();
            if (!response.ok || body.service !== expected) throw new Error('production_health_check_failed');
            if (expected === 'ai-agent-runner-api' && body.executionWorker !== 'eu-vm-agent-run') {
              throw new Error('production_france_default_mismatch');
            }
          }
          console.log('Sandbox account and production CP/Runner health verified.');
          NODE

      - name: Validate sandbox Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.sandbox-tg-sandbox3.toml

      - name: Install scoped production E2E signature and pinned test operator credentials
        if: ${{ inputs.run_canary == true || inputs.resume_pending_input == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PRODUCTION_E2E_SIGNATURE: ${{ secrets.CONTROL_PLANE_PRODUCTION_E2E_SIGNATURE }}
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
          TG_SANDBOX_E2E_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_SANDBOX_E2E_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
        run: |
          set -euo pipefail
          WRANGLER_RETRY_STDIN_ENV=PRODUCTION_E2E_SIGNATURE tools/retry-cloudflare-command.sh \
            npx wrangler secret put CONTROL_PLANE_PRODUCTION_E2E_SIGNATURE --config wrangler.sandbox-tg-sandbox3.toml
          WRANGLER_RETRY_STDIN_ENV=TG_SANDBOX3_OPERATOR_TOKEN tools/retry-cloudflare-command.sh \
            npx wrangler secret put TG_SANDBOX3_OPERATOR_TOKEN --config wrangler.sandbox-tg-sandbox3.toml
          WRANGLER_RETRY_STDIN_ENV=TG_SANDBOX_E2E_CHAT_ID tools/retry-cloudflare-command.sh \
            npx wrangler secret put TG_SANDBOX_E2E_CHAT_ID --config wrangler.sandbox-tg-sandbox3.toml
          WRANGLER_RETRY_STDIN_ENV=TG_SANDBOX_E2E_USER_ID tools/retry-cloudflare-command.sh \
            npx wrangler secret put TG_SANDBOX_E2E_USER_ID --config wrangler.sandbox-tg-sandbox3.toml

      - name: Deploy sandbox ingress paused against isolated production CP profile
        if: ${{ inputs.run_canary == true || inputs.resume_pending_input == true || inputs.inspect_e2e_lane == true }}
        id: deploy-production-lane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/render-prod-principal-worker-config.mjs paused wrangler.prod-principal-paused.generated.toml
          tools/retry-cloudflare-command.sh npx wrangler deploy --strict --config wrangler.prod-principal-paused.generated.toml \
            --var "BUILD_SHA:${GITHUB_SHA}" --message "prod-principal-canary-paused-${GITHUB_SHA}"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Enable the pinned prod-principal test lane
        if: ${{ inputs.run_canary == true || inputs.resume_pending_input == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/render-prod-principal-worker-config.mjs live wrangler.prod-principal-live.generated.toml
          tools/retry-cloudflare-command.sh npx wrangler deploy --strict --config wrangler.prod-principal-live.generated.toml \
            --var "BUILD_SHA:${GITHUB_SHA}" --message "prod-principal-canary-live-${GITHUB_SHA}"

      - name: Run read-only question, France VM execution, persistence, and real Telegram delivery
        if: ${{ inputs.run_canary == true }}
        env:
          TG_SANDBOX_TARGET: prod-principal
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
          TG_SANDBOX_E2E_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_SANDBOX_E2E_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
        run: node tools/prod-principal-telegram-canary.mjs

      - name: Resume the one verified preaccepted production E2E input
        if: ${{ inputs.resume_pending_input == true }}
        env:
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
          TG_SANDBOX_E2E_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_SANDBOX_E2E_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
          PRODUCTION_E2E_SIGNATURE: ${{ secrets.CONTROL_PLANE_PRODUCTION_E2E_SIGNATURE }}
          PRODUCTION_E2E_RETRY_ROUTE: ${{ inputs.retry_route }}
        run: node tools/prod-principal-resume-held-input.mjs

      - name: Read current pinned E2E state without changing it
        if: ${{ inputs.diagnose_only == true || inputs.inspect_e2e_lane == true }}
        env:
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
          PRODUCTION_E2E_SIGNATURE: ${{ secrets.CONTROL_PLANE_PRODUCTION_E2E_SIGNATURE }}
        run: node tools/prod-principal-state-probe.mjs

      - name: Preserve evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-principal-telegram-canary-${{ github.run_id }}
          path: prod-principal-telegram-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Restore sandbox3 CP routing after confirmed terminal state
        if: ${{ always() && (steps.deploy-production-lane.outputs.deployed == 'true' || inputs.resume_pending_input == true || inputs.inspect_e2e_lane == true) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          node tools/prod-principal-restore-guard.mjs
          tools/retry-cloudflare-command.sh npx wrangler deploy --strict --config wrangler.sandbox-tg-sandbox3.toml \
            --message "sandbox3-restored-${GITHUB_SHA}"

      - name: Remove generated E2E Wrangler configs
        if: always()
        run: rm -f wrangler.prod-principal-paused.generated.toml wrangler.prod-principal-live.generated.toml
