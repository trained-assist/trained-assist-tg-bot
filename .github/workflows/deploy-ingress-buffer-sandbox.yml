name: Deploy passive ingress buffer sandbox

on:
  workflow_dispatch:
    inputs:
      deploy_buffer:
        description: Update the isolated non-production media buffer
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingress-buffer-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy-buffer:
    if: ${{ inputs.deploy_buffer == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify the configured Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "d740a05e9442c1d0feacae2dfc673e93"
          npx wrangler whoami --json > "$RUNNER_TEMP/cloudflare-whoami.json"
          node --input-type=module - "$RUNNER_TEMP/cloudflare-whoami.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const identity = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (!(identity.accounts ?? []).some(account => account.id === 'd740a05e9442c1d0feacae2dfc673e93')) {
            throw new Error('cloudflare_account_mismatch');
          }
          console.log('Verified the non-production Cloudflare account.');
          NODE
      - name: Install the sandbox3-only buffer credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          INGRESS_BUFFER_TOKEN_SANDBOX3: ${{ secrets.INGRESS_BUFFER_TOKEN_SANDBOX3 }}
        run: |
          set -euo pipefail
          test -n "$INGRESS_BUFFER_TOKEN_SANDBOX3"
          printf '%s' "$INGRESS_BUFFER_TOKEN_SANDBOX3" | npx wrangler secret put INGRESS_BUFFER_TOKEN_SANDBOX3 --config wrangler.ingress-buffer-sandbox.toml
      - name: Deploy only the private sandbox media buffer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --strict --config wrangler.ingress-buffer-sandbox.toml --message "ingress-buffer-sandbox-${GITHUB_SHA}"
