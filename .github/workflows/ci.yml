name: CI + Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  scenario-gate:
    name: scenario-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --include=dev
      - name: Replay mandatory user scenarios
        run: npm run test:staging
      - name: Save scenario results and tested revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-results/
          if-no-files-found: error

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Build Worker
        run: npx wrangler deploy --dry-run --env staging
      - name: Unit tests
        run: npm test
      - name: Media pipeline in local workerd and R2
        run: npm run test:media-runtime

  staging-gate:
    needs: [ci, scenario-gate, deploy-staging, smoke-test-staging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the actual staging deploy and smoke on this revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PUSH_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          if os.environ['EVENT'] == 'push':
              results = os.environ['PUSH_RESULTS'].split(',')
              assert len(results) == 4 and all(r == 'success' for r in results), results
              raise SystemExit(0)
          base = 'https://api.github.com/repos/' + os.environ['REPO']
          def get(path):
              request = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)
          required = {'ci', 'scenario-gate', 'deploy-staging', 'smoke-test-staging'}
          for _ in range(60):
              runs = get('/actions/workflows/ci.yml/runs?event=push&head_sha=' + os.environ['HEAD_SHA'])['workflow_runs']
              runs = [run for run in runs if run['head_sha'] == os.environ['HEAD_SHA']]
              if runs:
                  run = max(runs, key=lambda item: item['id'])
                  jobs = get('/actions/runs/' + str(run['id']) + '/jobs')['jobs']
                  checks = {job['name']: job for job in jobs if job['name'] in required}
                  if checks.keys() == required and all(job['status'] == 'completed' for job in checks.values()):
                      assert all(job['conclusion'] == 'success' for job in checks.values()), checks
                      print('Staging deploy and smoke passed on', os.environ['HEAD_SHA'])
                      raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('No successful staging deployment and smoke for this revision')
          PY

  deploy:
    runs-on: ubuntu-latest
    needs: [ci, staging-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # ADMIN_GROUP_ID is a Workers secret set once via `wrangler secret put` —
      # it isn't declared in wrangler.toml and deploy doesn't touch it, so it
      # silently went missing and every admin-group command (/adduser etc.)
      # got dropped with no error (2026-09-23 incident). Re-asserting it here
      # every deploy makes it self-healing instead of a one-off CLI step that
      # nothing reproduces.
      - name: Sync ADMIN_GROUP_ID secret (main)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: echo "${{ secrets.ADMIN_GROUP_ID }}" | npx wrangler secret put ADMIN_GROUP_ID
      # One loop instead of a hand-copied step per bot (issue #1302 §4.4):
      # adding a 4th bot is one more entry here, not another copy-pasted block.
      # BUILD_SHA is passed so the smoke step can prove the deployed revision.
      # FREELANCE_BOT_TOKEN is the enable flag: while it is not provisioned the
      # freelance env stays INERT (skipped with a warning, never a failure).
      - name: Deploy enabled Workers (main / recruiter / freelance)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FREELANCE_BOT_TOKEN: ${{ secrets.FREELANCE_BOT_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy() {
            name="$1"
            if [ "$name" = "main" ]; then
              npx wrangler deploy --var BUILD_SHA:"$BUILD_SHA"
            else
              npx wrangler deploy --env "$name" --var BUILD_SHA:"$BUILD_SHA"
            fi
          }
          for name in main recruiter; do
            echo "Deploying $name…"
            deploy "$name"
          done
          if [ -n "${FREELANCE_BOT_TOKEN:-}" ]; then
            echo "Deploying freelance…"
            deploy freelance
          else
            echo "::warning::FREELANCE_BOT_TOKEN not provisioned — skipping freelance deploy (env stays inert)"
          fi

  deploy-staging:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.preview.outputs.worker }}
    needs: [ci, scenario-gate]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Select isolated branch staging
        id: preview
        env:
          STAGING_BRANCH: ${{ github.ref_name }}
        run: |
          SUFFIX=$(printf '%s' "$STAGING_BRANCH" | sha256sum | cut -c1-12)
          echo "worker=ta-tg-staging-$SUFFIX" >> "$GITHUB_OUTPUT"
          node scripts/staging/prepare-preview.mjs "ta-tg-staging-$SUFFIX"
      - name: Deploy isolated staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.toml --env staging --var BUILD_SHA:${{ github.sha }} --var PREVIEW_ONLY:true

  smoke-test-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Staging health check
        run: node scripts/staging/check-health.mjs "https://${{ needs.deploy-staging.outputs.worker }}.skillset-apply.workers.dev/health" "${{ github.sha }}"

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Same enabled-set as the deploy loop above: main/recruiter always,
      # freelance only once its token is provisioned. Each enabled Worker must
      # serve the exact revision (buildSha) AND answer getMe with a bot identity
      # (via its own /debug/whoami) — a Worker wired to the wrong token would
      # otherwise pass a health-only check (issue #1302 §4.4).
      - name: Verify enabled Workers (buildSha + bot identity)
        env:
          FREELANCE_BOT_TOKEN: ${{ secrets.FREELANCE_BOT_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          verify() {
            name="$1"; url="$2"
            echo "— $name: $url"
            for i in $(seq 1 6); do
              body=$(curl -sf "$url/health" 2>/dev/null || true)
              if printf '%s' "$body" | grep -q "\"buildSha\":\"$BUILD_SHA\""; then
                echo "  ✅ buildSha=$BUILD_SHA"
                break
              fi
              echo "  attempt $i: health=$body"
              if [ "$i" = "6" ]; then echo "  ❌ $name did not serve buildSha=$BUILD_SHA"; exit 1; fi
              sleep 5
            done
            who=$(curl -sf "$url/debug/whoami" 2>/dev/null || true)
            if ! printf '%s' "$who" | grep -q '"is_bot":true'; then
              echo "  ❌ $name getMe identity check failed: $who"; exit 1
            fi
            echo "  ✅ bot identity ok"
          }
          verify main "https://trained-assist-tg-bot.skillset-apply.workers.dev"
          verify recruiter "https://trained-assist-tg-bot-recruiter.skillset-apply.workers.dev"
          if [ -n "${FREELANCE_BOT_TOKEN:-}" ]; then
            # freelance uses a custom domain (its *.workers.dev route is disabled
            # by the custom_domain binding, and Telegram's resolver rejected the
            # fresh workers.dev host anyway) — verify the host setWebhook targets.
            verify freelance "https://tg-freelance.trainedassist.store"
          else
            echo "::warning::FREELANCE_BOT_TOKEN not provisioned — skipping freelance smoke (env stays inert)"
          fi

  autofix:
    needs: [ci, scenario-gate]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      (
        needs.ci.result == 'failure' ||
        needs.scenario-gate.result == 'failure'
      ) &&
      !startsWith(github.head_ref, 'fix/ci-')
    permissions:
      contents: write
      pull-requests: write
    uses: trained-assist/pr-autofix/.github/workflows/autofix-callable.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      original_branch: ${{ github.head_ref }}
      run_id: ${{ github.run_id }}
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      gh_token: ${{ secrets.GH_PAT || github.token }}
