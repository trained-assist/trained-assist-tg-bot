name: CI + Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  staging-gate:
    name: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --include=dev
      - name: Replay mandatory user scenarios
        run: npm run test:staging
      - name: Save scenario results and tested revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-results/
          if-no-files-found: error

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: [ci, staging-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [ci, staging-gate]
    if: github.ref != 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Deploy to staging (trained-assist-tg-bot-staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env staging

  smoke-test-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref != 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Staging health check
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://trained-assist-tg-bot-staging.skillset-apply.workers.dev/health" 2>/dev/null || echo 000)
            echo "  attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 5
          done
          [ "$STATUS" = "200" ] && echo "✅ Staging alive" || { echo "❌ Staging not responding (HTTP $STATUS)"; exit 1; }

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Worker health check
        run: |
          echo "Waiting for Worker to be live (up to 30s)..."
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://trained-assist-tg-bot.skillset-apply.workers.dev/health" 2>/dev/null || echo 000)
            echo "  attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 5
          done
          [ "$STATUS" = "200" ] && echo "✅ Worker alive" || { echo "❌ Worker not responding (HTTP $STATUS)"; exit 1; }

