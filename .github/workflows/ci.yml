name: CI + Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  scenario-gate:
    name: scenario-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --include=dev
      - name: Replay mandatory user scenarios
        run: npm run test:staging
      - name: Save scenario results and tested revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-results/
          if-no-files-found: error

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Build Worker
        run: npx wrangler deploy --dry-run --env staging
      - name: Unit tests
        run: npm test
      - name: Media pipeline in local workerd and R2
        run: npm run test:media-runtime

  restart-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: trained-assist/trained-assist-agent
          ref: 0113af07eef0ceecfbf293b25d1802b08f67f715
          path: .restart-agent
          persist-credentials: false
      - run: npm ci --include=dev
        working-directory: .restart-agent
      - name: Bundle this revision's real gateway callback
        run: npx esbuild src/lib/restart-confirmations.js --bundle --platform=node --format=esm --outfile=/tmp/restart-gateway-adapter.mjs
      - name: Gateway to agent restart and confirmation cycle
        working-directory: .restart-agent
        env:
          RESTART_GATEWAY_ADAPTER: /tmp/restart-gateway-adapter.mjs
        run: npx vitest run tests/planned-restart-http.test.js

  staging-gate:
    needs: [ci, scenario-gate, restart-integration, deploy-staging, smoke-test-staging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the actual staging deploy and smoke on this revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PUSH_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          if os.environ['EVENT'] == 'push':
              results = os.environ['PUSH_RESULTS'].split(',')
              assert len(results) == 5 and all(r == 'success' for r in results), results
              raise SystemExit(0)
          base = 'https://api.github.com/repos/' + os.environ['REPO']
          def get(path):
              request = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)
          required = {'ci', 'scenario-gate', 'restart-integration', 'deploy-staging', 'smoke-test-staging'}
          for _ in range(60):
              runs = get('/actions/workflows/ci.yml/runs?event=push&head_sha=' + os.environ['HEAD_SHA'])['workflow_runs']
              runs = [run for run in runs if run['head_sha'] == os.environ['HEAD_SHA']]
              if runs:
                  run = max(runs, key=lambda item: item['id'])
                  jobs = get('/actions/runs/' + str(run['id']) + '/jobs')['jobs']
                  checks = {job['name']: job for job in jobs if job['name'] in required}
                  if checks.keys() == required and all(job['status'] == 'completed' for job in checks.values()):
                      assert all(job['conclusion'] == 'success' for job in checks.values()), checks
                      print('Staging deploy and smoke passed on', os.environ['HEAD_SHA'])
                      raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('No successful staging deployment and smoke for this revision')
          PY

  deploy:
    runs-on: ubuntu-latest
    needs: [ci, staging-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-staging:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.preview.outputs.worker }}
    needs: [ci, scenario-gate, restart-integration]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Select isolated branch staging
        id: preview
        env:
          STAGING_BRANCH: ${{ github.ref_name }}
        run: |
          SUFFIX=$(printf '%s' "$STAGING_BRANCH" | sha256sum | cut -c1-12)
          echo "worker=ta-tg-staging-$SUFFIX" >> "$GITHUB_OUTPUT"
          node scripts/staging/prepare-preview.mjs "ta-tg-staging-$SUFFIX"
      - name: Deploy isolated staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.toml --env staging --var BUILD_SHA:${{ github.sha }} --var PREVIEW_ONLY:true

  smoke-test-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push'
    steps:
      - name: Staging health check
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ needs.deploy-staging.outputs.worker }}.skillset-apply.workers.dev/health" 2>/dev/null || echo 000)
            echo "  attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 5
          done
          [ "$STATUS" = "200" ] || { echo "Staging HTTP $STATUS"; exit 1; }
          curl --fail --silent --show-error "https://${{ needs.deploy-staging.outputs.worker }}.skillset-apply.workers.dev/health" > /tmp/staging-health.json
          python3 -c 'import json; assert json.load(open("/tmp/staging-health.json"))["buildSha"] == "${{ github.sha }}", "Wrong staging revision"'

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Worker health check
        run: |
          echo "Waiting for Worker to be live (up to 30s)..."
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://trained-assist-tg-bot.skillset-apply.workers.dev/health" 2>/dev/null || echo 000)
            echo "  attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 5
          done
          [ "$STATUS" = "200" ] && echo "✅ Worker alive" || { echo "❌ Worker not responding (HTTP $STATUS)"; exit 1; }
