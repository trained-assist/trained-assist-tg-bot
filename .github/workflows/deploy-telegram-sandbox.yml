name: Deploy Telegram sandbox

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy only the isolated probability Telegram sandbox
        required: true
        type: choice
        options:
          - skip
          - probability-sandbox
        default: skip
      run_agent_e2e:
        description: Run one bounded Runner task and Telegram reply in the probability sandbox
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guard:
    if: ${{ inputs.target != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected main revision and exact target
        env:
          TARGET: ${{ inputs.target }}
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/heads/main"
          test "$TARGET" = "probability-sandbox"
          echo "Approved target: trained-assist-tg-ux-sandbox"

  deploy-probability-sandbox:
    needs: [guard]
    if: ${{ inputs.target == 'probability-sandbox' && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Verify the expected Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = "d740a05e9442c1d0feacae2dfc673e93"
          npx wrangler whoami --json > "$RUNNER_TEMP/cloudflare-whoami.json"
          node --input-type=module - "$RUNNER_TEMP/cloudflare-whoami.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const identity = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const accounts = Array.isArray(identity.accounts) ? identity.accounts : [];
          const account = accounts.find(item => item.id === 'd740a05e9442c1d0feacae2dfc673e93');
          if (identity.loggedIn !== true || !account || account.name !== "Typeformowner@gmail.com's Account" ||
              identity.email && identity.email.toLowerCase() !== 'typeformowner@gmail.com') {
            throw new Error('Cloudflare identity/account verification failed; no Worker operation is allowed');
          }
          console.log(`Verified ${identity.email} / ${account.id} (${account.name})`);
          NODE

      - name: Bundle the fixed sandbox Worker
        run: npx wrangler deploy --dry-run --config wrangler.sandbox-tg-existing-ux.toml

      - name: Deploy only the probability sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: npx wrangler deploy --strict --config wrangler.sandbox-tg-existing-ux.toml --message "sandbox-main-${GITHUB_SHA}"

      - name: Verify active deployment and public liveness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler deployments status --name trained-assist-tg-ux-sandbox --json > "$RUNNER_TEMP/deployment-status.json"
          cat "$RUNNER_TEMP/deployment-status.json"
          node --input-type=module - "$RUNNER_TEMP/deployment-status.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const status = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const text = JSON.stringify(status);
          const expectedSha = process.env.GITHUB_SHA;
          const deploymentMessage = status.annotations?.["workers/message"] ?? "";
          if (!deploymentMessage.includes(expectedSha) && !text.includes(expectedSha)) {
            throw new Error('Active deployment metadata does not identify the checked-out source SHA');
          }
          NODE
          curl --fail --silent --show-error https://trained-assist-tg-ux-sandbox.skillset-apply.workers.dev/health \
            | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const health = JSON.parse(input);
              if (health.status !== "ok" || health.mode !== "existing-ux-control-plane") process.exit(1);
              console.log(JSON.stringify({ status: health.status, mode: health.mode }));
            '
          {
            echo "### Telegram sandbox deployment"
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Worker: \`trained-assist-tg-ux-sandbox\`"
            echo "- Cloudflare identity was verified before deployment."
            echo "- Worker deployment status and /health smoke passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean CP and Runner sandbox before resetting Telegram buffers
        id: cp_cleanup_before
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node tools/dispatch-cp-sandbox-cleanup.mjs | tee cp-cleanup-before.log

      - name: Require all sandbox buffers empty before starting tests
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_CLEANUP_TOKEN: ${{ secrets.TG_SANDBOX_CLEANUP_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs reset | tee sandbox-reset-before.json

      - name: Run existing-UX Worker contract tests
        run: npx vitest run tests/control-plane-existing-ux-entrypoint.test.js tests/control-plane-existing-ux-workerd.test.js --silent | tee worker-contract-tests.log

      - name: Verify sandbox buffers stayed empty during local Worker contract tests
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_CLEANUP_TOKEN: ${{ secrets.TG_SANDBOX_CLEANUP_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs inspect | tee sandbox-empty-after-contract.json

      - name: Test fresh messages aggregate in the sandbox buffer
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_CLEANUP_TOKEN: ${{ secrets.TG_SANDBOX_CLEANUP_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs test-buffers | tee sandbox-buffer-test.json

      - name: Test login, Runner answer and Telegram delivery in the probability sandbox
        if: ${{ inputs.run_agent_e2e == true }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_CLEANUP_TOKEN: ${{ secrets.TG_SANDBOX_CLEANUP_TOKEN }}
          TG_SANDBOX_E2E_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_SANDBOX_E2E_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
        run: node tools/sandbox-probability-agent-e2e.mjs

      - name: Clean CP and Runner state before deleting Telegram state
        id: cp_cleanup_after
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node tools/dispatch-cp-sandbox-cleanup.mjs | tee cp-cleanup-after.log

      - name: Clear Telegram sandbox state after CP and Runner cleanup
        id: telegram_cleanup_after
        if: always() && steps.cp_cleanup_after.outcome == 'success'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_CLEANUP_TOKEN: ${{ secrets.TG_SANDBOX_CLEANUP_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs reset | tee sandbox-reset-after.json

      - name: Require empty CP and Telegram buffers after cleanup
        if: always() && steps.cp_cleanup_after.outcome == 'success' && steps.telegram_cleanup_after.outcome == 'success'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_CLEANUP_TOKEN: ${{ secrets.TG_SANDBOX_CLEANUP_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs inspect | tee sandbox-empty-after.json

      - name: Upload probability sandbox E2E evidence
        if: ${{ always() && inputs.run_agent_e2e == true }}
        uses: actions/upload-artifact@v4
        with:
          name: probability-sandbox-agent-e2e-${{ github.run_id }}
          path: |
            sandbox-probability-agent-e2e-evidence.json
            cp-cleanup-before.log
            sandbox-reset-before.json
            sandbox-empty-after-contract.json
            worker-contract-tests.log
            sandbox-buffer-test.json
            cp-cleanup-after.log
            sandbox-reset-after.json
            sandbox-empty-after.json
          if-no-files-found: ignore
          retention-days: 7
