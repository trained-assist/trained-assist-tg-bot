name: Sandbox3 Telegram worker E2E

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the isolated sandbox3 Worker to CP to Runner to Telegram scenario
        required: true
        type: boolean
        default: false
      scenario:
        description: User input scenario to exercise after the clean preflight
        required: true
        type: choice
        options:
          - basic
          - service-reply
          - capability-reply
          - ready-quick
          - ready-agent
          - multiline
          - history
          - stop
          - retry-mid-run
          - file-intake
          - image-intake
          - pdf-intake
          - docx-intake
          - csv-intake
          - artifact-export
          - playwright-artifact
          - ping-pong
        default: basic
      delivery_mode:
        description: Capture Worker output without sending Telegram messages, or verify actual Telegram delivery
        required: true
        type: choice
        options:
          - capture
          - telegram
        default: capture
  workflow_call:
    inputs:
      run_e2e:
        required: false
        type: boolean
        default: false
      scenario:
        required: false
        type: string
        default: ping-pong
      delivery_mode:
        required: false
        type: string
        default: telegram
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true
      TG_SANDBOX3_CHAT_ID:
        required: true
      TG_STAGING_TEST_USER_ID:
        required: true
      TG_SANDBOX3_OPERATOR_TOKEN:
        required: true
      INGRESS_BUFFER_TOKEN_SANDBOX3:
        required: true
      GH_PAT:
        required: true

permissions:
  contents: read

concurrency:
  group: trained-assist-sandbox3-worker-e2e
  cancel-in-progress: false

jobs:
  sandbox3-e2e:
    if: ${{ inputs.run_e2e == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Require protected main
        env:
          REF: ${{ github.ref }}
          SCENARIO: ${{ inputs.scenario }}
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
        run: |
          set -euo pipefail
          test "$REF" = "refs/heads/main"
          if [[ "$DELIVERY_MODE" == capture && "$SCENARIO" != *-intake && "$SCENARIO" != artifact-export && "$SCENARIO" != playwright-artifact ]]; then
            echo 'Capture delivery mode supports file intake and artifact scenarios.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: trained-assist/trained-assist-control-plane
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: control-plane
          persist-credentials: false

      - name: Pin reviewed Control Plane revision for this test
        id: cp-revision
        run: |
          set -euo pipefail
          sha="$(git -C control-plane rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_CP_SHA=$sha" >> "$GITHUB_ENV"
          echo "Pinned Control Plane revision: $sha"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Verify exact sandbox account and pinned Telegram identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX3_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_STAGING_TEST_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
        run: |
          set -euo pipefail
          check_equal() {
            local name="$1" actual="$2" expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "Configuration mismatch: $name"
              return 1
            fi
          }
          check_equal CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" "d740a05e9442c1d0feacae2dfc673e93"
          check_equal TG_SANDBOX3_CHAT_ID "$TG_SANDBOX3_CHAT_ID" "1714048"
          check_equal TG_STAGING_TEST_USER_ID "$TG_STAGING_TEST_USER_ID" "1714048"
          if [[ ! "$TG_SANDBOX3_CHAT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Configuration mismatch: TG_SANDBOX3_CHAT_ID format"
            exit 1
          fi
          npx wrangler whoami --json > "$RUNNER_TEMP/cloudflare-whoami.json"
          node --input-type=module - "$RUNNER_TEMP/cloudflare-whoami.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const identity = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const account = (identity.accounts ?? []).find(item => item.id === 'd740a05e9442c1d0feacae2dfc673e93');
          if (!identity.loggedIn || !account) throw new Error('cloudflare_identity_mismatch');
          console.log('Verified the configured sandbox account and Telegram test identity.');
          NODE

      - name: Validate sandbox3 Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.sandbox-tg-sandbox3.toml

      - name: Deploy sandbox3 with ingress and delivery paused
        id: deploy-sandbox3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX3_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy-paused.ndjson
        run: |
          set -euo pipefail
          TEST_CHAT_IDS=''
          if [[ "$DELIVERY_MODE" == capture ]]; then TEST_CHAT_IDS="$TG_SANDBOX3_CHAT_ID"; fi
          npx wrangler deploy --strict --config wrangler.sandbox-tg-sandbox3.toml \
            --var TG_SLICE_INGRESS_PAUSED:true --var TG_SLICE_DELIVERY_PAUSED:true \
            --var "TEST_CHAT_IDS:$TEST_CHAT_IDS" --message "sandbox3-e2e-paused-${GITHUB_SHA}"

      - name: Install pinned test identity and dedicated operator secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
          INGRESS_BUFFER_TOKEN: ${{ secrets.INGRESS_BUFFER_TOKEN_SANDBOX3 }}
          TG_SANDBOX_E2E_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_SANDBOX_E2E_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$TG_SANDBOX3_OPERATOR_TOKEN"
          test -n "$INGRESS_BUFFER_TOKEN"
          printf '%s' "$TG_SANDBOX3_OPERATOR_TOKEN" | npx wrangler secret put TG_SANDBOX3_OPERATOR_TOKEN --config wrangler.sandbox-tg-sandbox3.toml
          printf '%s' "$INGRESS_BUFFER_TOKEN" | npx wrangler secret put INGRESS_BUFFER_TOKEN --config wrangler.sandbox-tg-sandbox3.toml
          printf '%s' "$TG_SANDBOX_E2E_CHAT_ID" | npx wrangler secret put TG_SANDBOX_E2E_CHAT_ID --config wrangler.sandbox-tg-sandbox3.toml
          printf '%s' "$TG_SANDBOX_E2E_USER_ID" | npx wrangler secret put TG_SANDBOX_E2E_USER_ID --config wrangler.sandbox-tg-sandbox3.toml

      - name: Verify CP sandbox bindings, principals and empty task store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node control-plane/tools/sandbox3-lane-preflight.mjs | tee sandbox3-lane-preflight.json

      - name: Read the existing sandbox3 delivery owner without sending
        env:
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = 'https://trained-assist-tg-sandbox3.skillset-apply.workers.dev/operator/delivery-cutover-v1';
          let responseOk = false;
          let state = {};
          // Edges can keep serving the prior live Worker revision for tens of
          // seconds after an upload. Wait until the just-deployed paused revision
          // is actually observed; proceeding on a stale lane risks real traffic.
          const deadline = Date.now() + 120_000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url, {
                headers: { authorization: `Bearer ${process.env.TG_SANDBOX3_OPERATOR_TOKEN}` },
                signal: AbortSignal.timeout(10_000),
              });
              responseOk = response.ok;
              state = await response.json().catch(() => ({}));
            } catch {
              // A brief edge reset during rollout is inconclusive. Keep polling
              // until the paused revision is observed or the deadline expires.
              responseOk = false;
              state = {};
            }
            if (responseOk && state.ready === true && state.paused === true && state.ingressPaused === true) break;
            await new Promise(resolve => setTimeout(resolve, 2_000));
          }
          const summary = { httpOk: responseOk, ready: state.ready === true,
            paused: state.paused === true, ingressPaused: state.ingressPaused === true };
          console.log(JSON.stringify(summary));
          if (!summary.httpOk || !summary.ready || !summary.paused || !summary.ingressPaused) {
            throw new Error('sandbox3_v1_delivery_owner_not_safely_paused');
          }
          NODE

      - name: Reset CP and both Telegram intake buffers before tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_TARGET: sandbox3
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs reset | tee sandbox3-reset-before.json

      # This job owns the shared sandbox E2E concurrency lock. Reconcile the CP
      # revision only after the paused lane's normal cleanup confirms reusable state.
      - name: Bring sandbox Control Plane to the pinned reviewed revision
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          EXPECTED_CP_SHA: ${{ steps.cp-revision.outputs.sha }}
        run: node tools/ensure-sandbox3-cp-revision.mjs | tee sandbox3-cp-revision.json

      - name: Require exact CP revision and lane contract before enabling tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EXPECTED_CP_SHA: ${{ steps.cp-revision.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            if node control-plane/tools/sandbox3-lane-preflight.mjs > sandbox3-lane-preflight-pinned.json; then
              cat sandbox3-lane-preflight-pinned.json
              exit 0
            fi
            # Cloudflare can still serve the previous CP revision briefly after
            # the deployment API reports success. Retry only that exact mismatch.
            if ! node -e 'const p=require("./sandbox3-lane-preflight-pinned.json"); process.exit(p.cpBuildSha !== process.env.EXPECTED_CP_SHA && p.checks?.cpLiveness === "BLOCKED" ? 0 : 1)'; then
              cat sandbox3-lane-preflight-pinned.json
              exit 2
            fi
            sleep 3
          done
          cat sandbox3-lane-preflight-pinned.json
          exit 2

      - name: Enable sandbox3 ingress and delivery after clean preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX3_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy-live.ndjson
        run: |
          set -euo pipefail
          TEST_CHAT_IDS=''
          if [[ "$DELIVERY_MODE" == capture ]]; then TEST_CHAT_IDS="$TG_SANDBOX3_CHAT_ID"; fi
          npx wrangler deploy --strict --config wrangler.sandbox-tg-sandbox3.toml \
            --var TG_SLICE_INGRESS_PAUSED:false --var TG_SLICE_DELIVERY_PAUSED:false \
            --var "TEST_CHAT_IDS:$TEST_CHAT_IDS" --message "sandbox3-e2e-live-${GITHUB_SHA}"

      - name: Verify exact active Worker revision and health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name trained-assist-tg-sandbox3 --json > "$RUNNER_TEMP/sandbox3-deployment.json"
          node --input-type=module - "$RUNNER_TEMP/sandbox3-deployment.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const status = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const serialized = JSON.stringify(status);
          const message = status.annotations?.['workers/message'] ?? '';
          const expectedRevision = process.env.GITHUB_SHA.slice(0, 12);
          if (!message.includes(expectedRevision) && !serialized.includes(process.env.GITHUB_SHA)) {
            throw new Error('sandbox3_active_worker_sha_mismatch');
          }
          console.log(JSON.stringify({ activeRevisionMatches: true }));
          NODE
          curl --fail --silent --show-error https://trained-assist-tg-sandbox3.skillset-apply.workers.dev/health \
            | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const health = JSON.parse(input);
              if (health.status !== "ok" || health.mode !== "existing-ux-control-plane") process.exit(1);
              console.log(JSON.stringify({ status: health.status, mode: health.mode }));
            '

      - name: Verify clean state before starting scenarios
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX_TARGET: sandbox3
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs inspect | tee sandbox3-preflight-empty.json

      - name: Recheck CP revision at scenario boundary
        env:
          EXPECTED_CP_SHA: ${{ steps.cp-revision.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://trained-assist-cp-sandbox3.skillset-apply.workers.dev/healthz', { signal: AbortSignal.timeout(10000) });
          const health = await response.json();
          if (!response.ok || health.buildSha !== process.env.EXPECTED_CP_SHA) throw new Error('sandbox_cp_revision_changed_before_scenarios');
          console.log(JSON.stringify({ cpBuildSha: health.buildSha, matched: true }));
          NODE


      - name: Test real Worker help, status and anonymous-login prompt
        if: ${{ inputs.scenario != 'ping-pong' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_TARGET: sandbox3
          TG_SANDBOX_E2E_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_SANDBOX_E2E_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
          TG_SANDBOX_E2E_DELIVERY: ${{ inputs.delivery_mode }}
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs test-user-entry | tee sandbox3-user-entry.json

      - name: Test fresh input aggregation in the real sandbox3 Intake DO
        if: ${{ inputs.scenario != 'ping-pong' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_TARGET: sandbox3
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
          TG_SANDBOX_E2E_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_SANDBOX_E2E_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
        run: node tools/sandbox-buffer-cycle.mjs test-buffers | tee sandbox3-buffer-scenario.json

      - name: Test profile login, Runner answer/artifact export, and optional Telegram delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_SANDBOX_TARGET: sandbox3
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
          TG_SANDBOX_E2E_CHAT_ID: ${{ secrets.TG_SANDBOX3_CHAT_ID }}
          TG_SANDBOX_E2E_USER_ID: ${{ secrets.TG_STAGING_TEST_USER_ID }}
          SANDBOX3_E2E_SCENARIO: ${{ inputs.scenario }}
          SANDBOX3_E2E_DELIVERY_MODE: ${{ inputs.delivery_mode }}
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/sandbox3-agent-e2e.mjs | tee sandbox3-agent-e2e.json

      - name: Clear test state after terminal E2E
        # Do not touch the shared lane when input/ref preflight failed before
        # the first mutating step. Once deployment was attempted, always
        # reconcile buffers even if the deploy/test itself failed.
        if: always() && steps.deploy-sandbox3.outcome != 'skipped'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX_TARGET: sandbox3
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs reset | tee sandbox3-reset-after.json

      - name: Require empty CP and Telegram intake state at exit
        id: final-state
        if: always() && steps.deploy-sandbox3.outcome != 'skipped'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TG_SANDBOX_TARGET: sandbox3
          TG_SANDBOX3_OPERATOR_TOKEN: ${{ secrets.TG_SANDBOX3_OPERATOR_TOKEN }}
        run: node tools/sandbox-buffer-cycle.mjs inspect | tee sandbox3-final-state.json

      - name: Restore normal sandbox delivery policy
        if: always() && steps.final-state.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy-normal-delivery.ndjson
        run: >-
          npx wrangler deploy --strict --config wrangler.sandbox-tg-sandbox3.toml
          --var TG_SLICE_INGRESS_PAUSED:false --var TG_SLICE_DELIVERY_PAUSED:false
          --var TEST_CHAT_IDS:
          --message "sandbox3-e2e-restore-delivery-${GITHUB_SHA}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox3-worker-e2e-${{ github.run_id }}
          path: |
            sandbox3-lane-preflight.json
            sandbox3-reset-before.json
            sandbox3-preflight-empty.json
            sandbox3-user-entry.json
            sandbox3-buffer-scenario.json
            sandbox3-agent-e2e.json
            sandbox3-agent-e2e-evidence.json
            sandbox3-reset-after.json
            sandbox3-final-state.json
          if-no-files-found: ignore
