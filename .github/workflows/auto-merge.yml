name: Auto-merge

on:
  workflow_run:
    workflows: ['CI + Deploy']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge-green-head:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # No checkout or execution of PR-controlled code with write credentials.
      - name: Require all staging jobs and merge only the tested PR head
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          jq -e '
            .jobs as $jobs |
            ["ci", "staging-regressions", "deploy-staging", "smoke-test-staging"] |
            all(. as $name | any($jobs[]; .name == $name and .conclusion == "success"))
          ' jobs.json
          gh api "repos/$REPO/commits/$HEAD_SHA/pulls" > pulls.json
          jq -r --arg sha "$HEAD_SHA" '.[] | select(.state == "open" and .draft == false and .base.ref == "main" and .head.sha == $sha) | .number' pulls.json |
          while read -r number; do
            gh pr merge "$number" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
          done
