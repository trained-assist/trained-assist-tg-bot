name = "trained-assist-tg-ux-sandbox"
main = "src/sandbox-tg/existing-ux.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "TG_DELIVERY_OWNER"
class_name = "TgDeliveryOwner"

[[durable_objects.bindings]]
name = "INTAKE"
class_name = "IntakeBufferReset"

[[durable_objects.bindings]]
name = "SANDBOX_ACCEPT_ONLY"
class_name = "SandboxAcceptOnlyStore"

[[migrations]]
tag = "sandbox-existing-ux-v1"
new_sqlite_classes = ["TgDeliveryOwner", "IntakeBuffer"]

[[migrations]]
tag = "sandbox-intake-reset-v2"
new_sqlite_classes = ["IntakeBufferReset"]

[[migrations]]
tag = "sandbox-intake-delete-old-v3"
deleted_classes = ["IntakeBuffer"]

[[migrations]]
tag = "sandbox-accept-only-v1"
new_sqlite_classes = ["SandboxAcceptOnlyStore"]

[[kv_namespaces]]
binding = "TG_SLICE"
id = "915ffeedb74440538009bdc1bd00d381"

[[kv_namespaces]]
binding = "SESSIONS"
id = "915ffeedb74440538009bdc1bd00d381"

# Read existing profile records created by the production admin flow. Runtime
# login only reads this namespace; sandbox password resets are written to TG_SLICE.
[[kv_namespaces]]
binding = "PRODUCTION_USERS"
id = "74c1930ed8464f4889c056031f0d42f8"

[[services]]
binding = "CONTROL_PLANE_SERVICE"
service = "trained-assist-cp-telegram-ux-v1-sandbox"

[vars]
TG_SANDBOX_BOT_USERNAME = "probability_cat_bot"
TG_SLICE_ROUTER_ENABLED = "true"
TG_SLICE_DELIVERY_PAUSED = "false"
TEST_CHAT_IDS = ""
# This user-facing test bot must deliver Telegram replies; it is not a log-only lane.
TG_HTTP_TEST_MODE = "false"
TG_SLICE_REQUEST_TIMEOUT_MS = "60000"
TG_SLICE_STOP_ENABLED = "true"
EXECUTION_BACKEND = "control-plane"
INTAKE_DEBOUNCE = "on"
SESSION_NAMESPACE = "integrator-existing-ux-v1"
MEDIA_PIPELINE = "off"
TG_ACCEPT_ONLY_ENABLED = "false"
TG_ACCEPT_ONLY_ENVIRONMENT = "sandbox"
TG_ACCEPT_ONLY_MODE = "accept-only"
# This bot is an isolated profile-login test lane; user profiles gate task input.
# No chat/Telegram-user allowlist is used for ordinary login E2E scenarios.
TG_SLICE_OPEN_SANDBOX = "true"
