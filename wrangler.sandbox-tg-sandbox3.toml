name = "trained-assist-tg-sandbox3"
main = "src/sandbox-tg/existing-ux.js"
workers_dev = true
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = true

[triggers]
crons = ["* * * * *"]

# Preserve the existing sandbox3 SQLite Durable Object namespaces and classes.
# No migration, class rename, or binding re-point is performed by this config.
[exports.TgDeliveryOwner]
type = "durable-object"
storage = "sqlite"

[exports.IntakeBuffer]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "TG_DELIVERY_OWNER"
class_name = "TgDeliveryOwner"

[[durable_objects.bindings]]
name = "INTAKE"
class_name = "IntakeBuffer"

[[kv_namespaces]]
binding = "TG_SLICE"
id = "f81925f900dc42fca7bec33d9d422840"

[[kv_namespaces]]
binding = "SESSIONS"
id = "9fbaf8e6a86f4673bf0990b540e75f6d"

[vars]
TG_SANDBOX_BOT_USERNAME = "ptichka_status_bot"
TG_SLICE_ROUTER_ENABLED = "true"
TG_SLICE_DELIVERY_PAUSED = "false"
TG_SLICE_INGRESS_PAUSED = "false"
TG_SLICE_REQUEST_TIMEOUT_MS = "60000"
TG_SLICE_STOP_ENABLED = "true"
EXECUTION_BACKEND = "control-plane"
INTAKE_DEBOUNCE = "on"
SESSION_NAMESPACE = "integrator-sandbox3-v1"
MEDIA_PIPELINE = "off"
CONTROL_PLANE_URL = "https://trained-assist-cp-sandbox3.skillset-apply.workers.dev"
CONTROL_PLANE_PRINCIPAL = "integration-sandbox3-v1"
CONTROL_PLANE_PROFILE = "integration-sandbox3-v1"
TG_ACCEPT_ONLY_ENVIRONMENT = "sandbox"
TG_ACCEPT_ONLY_ENABLED = "false"
TG_ACCEPT_ONLY_MODE = "accept-only"
TG_SLICE_OPEN_SANDBOX = "false"
TG_SANDBOX_TEST_API_ENABLED = "true"
TEST_CHAT_IDS = ""
TG_HTTP_TEST_MODE = "false"
