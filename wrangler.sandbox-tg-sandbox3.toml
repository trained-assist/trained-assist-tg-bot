name = "trained-assist-tg-sandbox3"
main = "src/sandbox-tg/existing-ux.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "TG_DELIVERY_OWNER"
class_name = "TgDeliveryOwner"

[[durable_objects.bindings]]
name = "INTAKE"
class_name = "IntakeBuffer"

[[migrations]]
tag = "sandbox3-existing-ux-v1"
new_sqlite_classes = ["TgDeliveryOwner", "IntakeBuffer"]

[[kv_namespaces]]
binding = "TG_SLICE"
id = "f81925f900dc42fca7bec33d9d422840"

[[kv_namespaces]]
binding = "SESSIONS"
id = "9fbaf8e6a86f4673bf0990b540e75f6d"

[vars]
TG_SANDBOX_BOT_USERNAME = "REPLACE_WITH_BOT_USERNAME"
TG_SLICE_ROUTER_ENABLED = "true"
TG_SLICE_DELIVERY_PAUSED = "false"
TG_SLICE_REQUEST_TIMEOUT_MS = "60000"
TG_SLICE_STOP_ENABLED = "true"
EXECUTION_BACKEND = "control-plane"
INTAKE_DEBOUNCE = "on"
SESSION_NAMESPACE = "integrator-sandbox3-v1"
MEDIA_PIPELINE = "off"
CONTROL_PLANE_URL = "https://trained-assist-cp-telegram-ux-v1-sandbox.skillset-apply.workers.dev"
CONTROL_PLANE_PRINCIPAL = "integration-sandbox3-v1"
CONTROL_PLANE_PROFILE = "integration-sandbox3-v1"

# Provision secrets directly with `wrangler secret put` for this config.
# Never commit bot credentials, webhook secrets, principal signatures, allowlists,
# or the delivery cutover manifest.
