name = "alesa-bot"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ADMIN_GROUP_ID = "-5308931318"

# Secrets (set via `wrangler secret put`):
#   BOT_TOKEN      — Telegram bot token
#   BOT_SECRET     — shared secret for Chrome extension
#   AGENT_URL      — URL of alesa-agent HTTP API
#   AGENT_SECRET   — shared secret for bot↔agent auth

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "USERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"
