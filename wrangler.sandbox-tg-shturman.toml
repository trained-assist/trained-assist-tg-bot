name = "trained-assist-tg-shturman-sandbox"
main = "src/sandbox-tg/existing-ux.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "TG_DELIVERY_OWNER"
class_name = "TgDeliveryOwner"

[[durable_objects.bindings]]
name = "INTAKE"
class_name = "IntakeBuffer"

[[durable_objects.bindings]]
name = "SANDBOX_ACCEPT_ONLY"
class_name = "SandboxAcceptOnlyStore"

[[migrations]]
tag = "sandbox-shturman-existing-ux-v1"
new_sqlite_classes = ["TgDeliveryOwner", "IntakeBuffer"]

[[migrations]]
tag = "sandbox-accept-only-v1"
new_sqlite_classes = ["SandboxAcceptOnlyStore"]

[[kv_namespaces]]
binding = "TG_SLICE"
id = "d6116c95eed14c5fab07f12bd52d89f5"

[[kv_namespaces]]
binding = "SESSIONS"
id = "53d91bee6baa45f286a84a80c5eff220"

[[services]]
binding = "CONTROL_PLANE_SERVICE"
service = "trained-assist-cp-telegram-ux-v1-sandbox"

[vars]
TG_SANDBOX_BOT_USERNAME = "Shturman_bot"
TG_SLICE_ROUTER_ENABLED = "true"
TG_SLICE_DELIVERY_PAUSED = "false"
TG_SLICE_REQUEST_TIMEOUT_MS = "60000"
TG_SLICE_STOP_ENABLED = "false"
EXECUTION_BACKEND = "control-plane"
INTAKE_DEBOUNCE = "on"
SESSION_NAMESPACE = "integrator-shturman-v1"
MEDIA_PIPELINE = "off"
TG_ACCEPT_ONLY_ENABLED = "true"
TG_ACCEPT_ONLY_ENVIRONMENT = "sandbox"
TG_ACCEPT_ONLY_MODE = "accept-only"
CONTROL_PLANE_URL = "https://trained-assist-cp-telegram-ux-v1-sandbox.skillset-apply.workers.dev"
CONTROL_PLANE_PRINCIPAL = "integration-telegram-ux-v1"
CONTROL_PLANE_PROFILE = "integration-telegram-ux-v1"

# Provision secrets directly with `wrangler secret put` for this config.
# Never commit bot credentials, webhook secrets, principal signatures, allowlists,
# or the delivery cutover manifest.
